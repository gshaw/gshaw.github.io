    fine. Any slower might have had me getting bored but the last couple of
    chapters make it worth while. Looking forward to reading some more from Le
    Carré.

    Recommend for anybody that loves a good spy story but is OK with it being
    more about building suspense and characters than action and gadgets. This
    isn't James Bond.
- id: 30555488
  title: The Underground Railroad
  author: Whitehead, Colson
  rating: 5/5
  date: Apr 10, 2022
  review: |-
    I like to read fiction and non-fiction together around the same topic so
    while reading Narrative of the Life of Frederick Douglass I was also reading
    this book.

    Wasn't sure what to expect but was pleasantly surprised. The writing is
    suburb. The story was initially confusing because this isn't historical
    fiction, more like historical surrealism (I just made that term up). Great
    characters and creative story telling.

    Recommend for people looking for a novel with great writing and looking for
    a different way to tell the awful story of the history of American slavery.
    Would recommend being at least familiar with some of the actual history
    before or after, e.g., read the Wikipedia articles on the Underground
    Railroad and the Tuskegee Syphilis Study.
- id: 36529
  title: Narrative of the Life of Frederick Douglass
  author: Douglass, Frederick
  rating: 5/5
  date: Apr 08, 2022
  review: |-
    After listening to Dan Carlin's Hardcore History episode "Human Resources"
    on the Atlantic Slave Trade I noticed he quoted from this book so thought
    I'd give it a read as I've had it on my list for years.

    Great read, and amazing primary source from a slave of that time. Incredible
    that he could teach himself to read and write under that situation. In many
    ways the book reminded me on "Man's Search For Meaning" for the strength of
    character Douglass has.

    Recommend for anybody interested in BLM, American History, and human rights.
    Read it while listening to Dan Carlin's podcast on the same topic for
    additional breadth.
- id: 22394477
  title: The Swift Programming Language
  author: Apple Inc.
  rating: 5/5
  date: Apr 04, 2022
  review: |-
    Surprisingly well written language reference book. This isn't a tutorial to
    teach you how to build iOS/Mac apps but it does explain all the features of
    the language, and there are a lot of them!

    Note I read the first half of the book which covers all the features and
    then skimmed through the details of the language specification which is more
    aimed and defining the language.

    I've got a background in Objective-C and have been recently making the move
    to Swift for some new projects. I appreciate that the book is kept up to
    date with new release of the language.

    Recommend if you want to program in Swift.
- id: 1078
  title: "The Good Earth (House of Earth, #1)"
  author: Buck, Pearl S.
  rating: 4/5
  date: Apr 2022
  review: |-
    Well it's a good story. Not so sure how accurate it portrays rural Chinese
    farmers from the 1920s but it was an entertaining story. I'm sure there are
    some things that are accurate and some stereotypes going on. The story felt
    a little too neat to be believable. My favourite character was O-Lan.

    I'd love to sit in on a discussion on this book to hear more opinions.

    Recommend if you are looking for a decent story set in rural China in the
    1920s.
- id: 56702078
  title: "Electrify: An Optimist's Playbook for Our Clean Energy Future"
  author: Griffith, Saul
  rating: 4/5
  date: Feb 27, 2022
  review: |-
    "What if it's a big hoax and we create a better world for nothing?"
    - cartoon by Joel Pett, 2009

    Giving it 4 stars because I can imagine a covering the same topic going even
    deeper. That said, this is an important body of work and a great start and
    simplify the problem of climate change into something that we can act and
    move on right now. And we as a species need to act.

    The great thing is that we can build a better future with a better economy
    and end up with a better world for all by electrifying everything and moving
    away from fossil fuels. Look at just one example, the nightmare in Ukraine
    and giving billions and billions of dollars/euros to Russia for fossil
    fuels.

    We have the technology and the ability to move to renewables, we just need
    to all move together to make it happen.

    Recommend for anybody looking for an optimistic book about how we can solve
    global warming.
- id: 28921
  title: The Remains of the Day
  author: Ishiguro, Kazuo
  rating: 5/5
  date: Feb 18, 2022
  review: |-
    I've previously read Never Let Me Go by Ishiguro and was looking forward for
    another story by him. This is completely different and yet still completely
    amazing. Really hard to review or explain why though. The story is fairly
    simple but how deep you go into Steven's mind it feels like I lived his
    life.

    Read some other reviews and decide if it's for you.

    Recommend for anybody who enjoys great literature and character development.
    Do not expect a fast pace thriller or a dystopian story like Never Let Me
    Go.
- id: 542389
  title: "Stalingrad: The Fateful Siege, 1942–1943"
  author: Beevor, Antony
  rating: 5/5
  date: Jan 28, 2022
  review: |-
    The absolute tragedy and horror the largest land battle ever fought.
    Extremely well written, if it wasn't history the story would be unbelievable
    in terms of scope and sheer madness in the destruction and loss of life on
    both sides. It's honestly impossible to understand how humans can do such
    things.

    Read this in conjunction with the novel City of Thieves which takes place in
    Leningrad (modern day St. Petersburg) and listening to Dan Carlin's Hardcore
    History Ghosts of the Ostfront. Unwittingly about a month later modern day
    Russian invades the Ukraine and results in what feels like memories of the
    past but this time for Russia.

    We need to do better as a species. ☮️❤️

    Recommend for anybody interested in WW2 Eastern Front or history in general.
- id: 1971304
  title: City of Thieves
  author: Benioff, David
  rating: 5/5
  date: Jan 15, 2022
  review: |-
