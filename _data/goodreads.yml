  title: "Quiet: The Power of Introverts in a World That Can't Stop Talking"
  author: Cain, Susan
  rating: 3/5
  date: Mar 15, 2024
  review: |-
    The content and the writing is good but for me the book was simply too long.
    I suppose a problem for authors because some people probably want more
    information but I found the concepts and ideas were spread far too thin to
    engage me completely. I plowed through the book learning and appreciating
    the ideas but wishing it would end sooner.

    Also, it was nice to have things confirmed but nothing really surprised me
    about the book. Introverts are different and require different strategies,
    there are lots of introverts, extroverts are the majority and have an
    advantage in our current society but many things are better performed by
    introverts including leadership (the best insight I received from the book).
- id: 11277444
  title: The Little Drummer Girl
  author: le Carré, John
  rating: 5/5
  date: Mar 02, 2024
  review: |-
    What a story and what a group of characters. Incredible story telling
    though. Writing isn't easy. Sometimes I found my mind wandering and wasn't
    sure if the writing was a bit too slow for me. When this happened I went
    back and re-read the pages and found that I missed a lot. If you stick with
    it though you end up with entirely different life etched into your mind
    which I love. Watching the AMC TV series now which helps bring the
    characters even more to life.

    The book was first published in 1983 and yet the politics haven't changed in
    the 41 years. The story could take place today. This is such a colossal
    failure of political leadership it boggles my mind.

    Read based on book recommendations from the Ezra Klein Show with Thomas
    Friedman (Jan 19, 2024).
