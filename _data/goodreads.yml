- id: 53328332
  title: "Less Is More: How Degrowth Will Save the World"
  author: Hickel, Jason
  rating: 5/5
  date: Apr 18, 2021
  review: |-
    Contender for the best of book of the year. Definitely the most important
    new book you can read this year. The first half is hard as it spells out in
    no unclear terms the path the world is heading isn't going to have a happy
    ending. The second half is about a number of different ideas to consider and
    use to open a discussion. He doesn't have all the solutions. Nobody does but
    right now we need to be talking about doing something different and that is
    a difficult problem in its own and where this book can help.

    The Italian philosopher Antonio Gramsci calls ‘cultural hegemony': when an
    ideology becomes so normalised that it is difficult or even impossible to
    reflect on it. This is what happens when you try to discuss an alternative
    to never ending growth and capitalism. The very idea to question is
    sacriligious but Jason Hickel wrote an entire book on it.

    What are we doing here? Where are we going? What's it all for? What is the
    end, as it were, of human existence? Growthism prevents us from stopping to
    think about these questions. It prevents us from reflecting on what we
    actually want our society to achieve. Indeed, the pursuit of growth comes to
    stand in for thought itself.

    Our current system isn't working for most people. 1% is getting richer while
    everybody else is getting left behind. We need to do something different.
- id: 6100832
  title: "The Management Myth: Why the Experts Keep Getting it Wrong"
