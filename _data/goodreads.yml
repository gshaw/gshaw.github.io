- id: 40121378
  title: "Atomic Habits: An Easy & Proven Way to Build Good Habits & Break Bad Ones"
  author: Clear, James
  rating: 4/5
  date: Jan 30, 2021
  review: |-
    Better than I thought it would be. Has the same problem with most modern
    self help books with spending too much time saying too little. The most
    useful thing I learned came near the end when it talked about looking at
    your identity.

    If you identify as "I'm a paramedic" and then for whatever reason stop being
    one you can suffer an identify crisis. His suggestion is to change your
    identity to something like "I'm somebody that cares for people in my
    community during emergencies." It ends up being a healthier identity and one
    that can never leave you.

    The idea is loosely connected to the entire process of building habits.
    Rather than forcing yourself to do or not do, change your identity into I'm
    somebody that does or doesn't do the behaviour.
