- id: 196840548
  title: "The Stranger: The Original Unabridged and Complete Edition"
  author: Camus, Albert
  rating: 4/5
  date: May 05, 2026
  review: |-
    A guy drifts through life performing nothing, feeling less, until he
    casually throws it all away. Somehow this makes him the most honest man in
    the room. Strong disagree with Camus. If we have to drop all performances
    to be real and see clearly I'll take my blindfold. Without "performances"
    you make nothing and connect with nobody. You might see life clearest, but
    you are going to see it alone.
- id: 45064996
  title: "Hyperion (Hyperion Cantos, #1)"
  author: Simmons, Dan
  rating: 5/5
  date: Apr 28, 2026
  review: |-
    SF meets Canterbury Tales with 6 different stories from 6 different
    characters. All wildly different. The first part of the book is confusing
    as hell but once you get into how the book is structured it works. I
    discussed the book with AI to help me understand the book structure.

    The world building is awesome and the depth of the characters better than
    most SF. It's long but it's brilliant.
