  title: "Factfulness: Ten Reasons We're Wrong About the World – and Why Things Are Better Than You Think"
  author: Rosling, Hans
  rating: 5/5
  date: May 07, 2018
  review: |-
    I really liked this book and hope a lot more people read it. I think the
    single biggest take away is that things can be bad while still getting
    better. Most people think the world is a much worse place than it is. This
    does not mean you ignore the social injustice, environmental pressure, or
    any of the many issues that need dealing with. Instead it means that you can
    acknowledge that yes, things need work AND yes we are making progress.

    The author gives a good blend of interesting stories of his life and a real
    wake up call as to how incredibly wrong most people are about the state of
    the world. If you do nothing else take look at http://dollarstreet.org to
    dispel the outdated notion of of west vs rest or developed vs undeveloped.
