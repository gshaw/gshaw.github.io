  review: |-

- id: 23168817
  title: "The Dark Forest (Remembrance of Earth's Past, #2)"
  author: Liu, Cixin
  rating: 5/5
  date: Jul 20, 2019
  review: |-

- id: 20518872
  title: "The Three-Body Problem (Remembrance of Earth's Past, #1)"
  author: Liu, Cixin
  rating: 5/5
  date: May 31, 2019
  review: |-
    Fun hard sci-if from Chinese author. Loved the plot and the incredible
    concepts. Some might be far fetched but honestly it doesn't matter. I think
    this would make an amazing movie with big enough budget. If you are looking
    for character development or literature you might be disappointed but if you
    want a fun read and our brain intrigued go for it.
- id: 6105434
  title: "Passionate Marriage: Keeping Love and Intimacy Alive in Committed Relationships"
  author: Schnarch, David
  rating: 5/5
  date: May 02, 2019
  review: |-
    Can't rate this book high enough. I gained a huge amount of insight about my
    self. The book's material goes well beyond relationships and can impact any
    aspect of your life but the core message is about love and intimacy. The
    frank eroticism was surprising and tastefully done. I would recommend this
    book to anybody in a relationship or that wants to be in one.
- id: 17690
  title: The Trial
  author: Kafka, Franz
  rating: 4/5
  date: May 12, 2019
  review: |-
    Powerful book I feel at least on totalitarianism and bureaucracy. At times
    difficult to read and you are left thinking WTF. When the dust settles and
    you let the book sit with you a few days you start to see the similarities
    in your own life that poor K goes through. I think that is where the power
    of the book shines.
- id: 37380
  title: The Heart Is a Lonely Hunter
  author: McCullers, Carson
  rating: 4/5
  date: May 2019
  review: |-
    Hard to believe this was written by somebody so young. The character
    development and story is suburb. Only giving 4 stars because it still didn't
    grip me completely and found I had to push a bit to finish it.
- id: 22318578
  title: "The Life-Changing Magic of Tidying Up: The Japanese Art of Decluttering and Organizing"
  author: Kondo, Marie
  rating: 4/5
  date: Mar 23, 2019
  review: |-
    More than I expected and pleasantly surprised by how much I enjoyed it.
- id: 32145
  title: "Stiff: The Curious Lives of Human Cadavers"
  author: Roach, Mary
  rating: 4/5
  date: Mar 10, 2019
  review: |-
    I don't think this book is for everybody but if you are curious it is well
    written. It starts off how you would expect and gives you plenty of time to
    bow out because at about 2/3 it starts to get weird and then it gets really
    weird. I found myself having to stop at some sections. I think of myself as
    having a pretty good imagination but somethings humans have done in the
    past... Wow. The saying of if you can think of it, somebody has tried it
    really is true. Great respectful writing about a topic that is the only
    guaranteed thing to happen to everybody.
- id: 43434269
  title: The Rust Programming Language
  author: Klabnik, Steve
  rating: 5/5
  date: Feb 18, 2019
  review: |-
    Well written and clear introduction to the Rust programming language. I used
    this book over the last few months to teach myself about Rust. The Rust
    tooling is great and it's nice to see a modern take on C. Rust has many
    benefits but I find it does come at a cost of complexity. Even after reading
    this book I still had to look up the idiomatic way of performing what I
    would consider simple tasks. The books is great to place to start but you'll
    need something more to really become proficient in Rust.
- id: 6334
  title: Never Let Me Go
  author: Ishiguro, Kazuo
  rating: 5/5
  date: Feb 17, 2019
  review: |-
    **spoiler alert** The novel annoyed me but for some reason I kept at it. I
    tries too hard to be a page turner using annoying techniques. At the end of
    each chapter to the point I made a mental note to skip the last paragraph in
    each chapter for this reason. The ending also needlessly explains the whole
    plot like a James Bond movie where the villain reveals the grand plan.

    I loved the premise and the issues that the book touched out. Many deep
    themes about betrayal, racism, love, sex, and illness. The biggest impact
    for me was showing the pandora's box scientific progress can open leaving
    humanity to deal with it the best it can.

    Edit: Increasing rating to 5 based on the fact how often I've thought about
    this book and ideas in it.
- id: 49455
  title: Notes from Underground
  author: Dostoevsky, Fyodor
  rating: 4/5
  date: Feb 2019
  review: |-
    I found this book hard to read and understand. I didn't understand why it
    was recommended so highly. It was painful to read and I found myself being
    angry reading it. After taking a pause and reading more about the book I
    concluded that was the point of the book. The book is purposely written to
    be hard and upset you. I believe that is what the author is trying
    accomplish through the writing and where the genius of the book comes from.
    I don't feel I understand it well but I am glad I attempted it. Reading
    something hard you don't fully understand isn't "fun" but it did open my
    mind as to what you can accomplish with literature.
- id: 37976541
  title: "Bad Blood: Secrets and Lies in a Silicon Valley Startup"
  author: Carreyrou, John
  rating: 5/5
  date: Feb 14, 2019
  review: |-
    Extremely well written, detailed, interesting and paced well. Many times
    found myself shaking my head in utter disbelief. Many people are vaguely
    familiar with the story but the details in the book make you realize how
    badly aligned some people's moral compass can be. I hope the criminal
    investigation is successful and those responsible face serious repercussions
    but with all her connections and the corruption that seems to ensure "no
    billionaire gets left behind" doesn't leave me optimistic. Time will tell.
- id: 527249
  title: Arc Light
  author: Harry, Eric L.
  rating: 2/5
  date: Feb 07, 2019
  review: |-
    Easy thriller about WW3 in the mid 90s. Some parts were good and some were
    just silly. Full jingoism in effect. As horrific of an event this would be,
    a realistic balanced novel from both sides would be an interesting read.
- id: 35133922
  title: Educated
  author: Westover, Tara
  rating: 4/5
  date: Jan 22, 2019
  review: |-
    Amazing story of an incredible women. Some parts are hard to read knowing
    they are true. She does a great storytelling without blatently judging.
    Enjoyed and would recommend.
- id: 27833670
  title: Dark Matter
  author: Crouch, Blake
  rating: 3/5
  date: Dec 31, 2018
  review: |-
    Squeezed this in as the last book of 2018. Easy fast read. Premise is
    interesting. Reads like a romantic thriller.
- id: 35018901
  title: "Head On (Lock In, #2)"
  author: Scalzi, John
  rating: 3/5
  date: Dec 30, 2018
  review: |-
    Easy sci-fi crime thriller. Not as interesting as the first in the series
    and I didn't think I would finish but the characters and story are fun and
    the world is unique and interesting. Lots of opportunities for alternate
    story lines.
- id: 34946912
  title: "The Manual: A Philosopher's Guide to Life"
  author: Epictetus
  rating: 4/5
  date: Jan 15, 2020, Dec 03, 2018
  review: |-
    An interesting quick read and introduction to Stoic Philosophy. I relate to
    Stoic Philosophy and love that the truths that were true more than 2000
    years ago still hold true today.

    Re-read in 2020. The book is short and dense so it deserves multiple reads.
    I read somewhere else that the value of this book is reminding you what you
    already know is true.
- id: 6411016
  title: Matterhorn
  author: Marlantes, Karl
  rating: 5/5
  date: Dec 2018
  review: |-
    Devastating novel of the Vietnam war told from the American perspective.
    Incredibly detailed. Characters and story are compelling and believable with
    many sides to love and hate.
- id: 719600
  title: "Gweilo: Memories of a Hong Kong Childhood"
  author: Booth, Martin
  rating: 5/5
  date: Nov 17, 2018
  review: |-
    Absolutely loved this book. I started it just before a trip to Hong Kong to
    get an idea but finished after I left. What a life experience to have.
    Writing is clear and well edited. I think to best appreciate it you need to
    have visited Hong Kong.
- id: 23168277
  title: "The Sympathizer (The Sympathizer, #1)"
  author: Nguyen, Viet Thanh
  rating: 4/5
  date: Nov 16, 2018
  review: |-
    Great story which goes in many different directions. The characters are
    really interesting. Sometimes the writing is absolutely brilliant and I
    found myself reading passages out loud to share them with others.
    Unfortunately sometimes I found the writing could have been edited a bit and
    I was lost. This happened more around the 2/3 mark but the book starts and
    ends strong and was great to read while traveling in Vietnam.
- id: 40582814
  title: Programming Ecto
  author: Wilson, Darin
  rating: 5/5
  date: Nov 10, 2018
  review: |-
    Really useful on understanding Ecto and how it was intended to be used.
    While learning Phoenix I needed to use Ecto but was feeling I was missing a
    number of key concepts about this library. This book filled in the holes and
    I'd recommend it for anybody using Ecto. It's not long and easy to read.
    Note this is based on the beta 5 release. There are still a couple of more
    chapters before the final release.
- id: 63697
  title: The Man Who Mistook His Wife for a Hat and Other Clinical Tales
  author: Sacks, Oliver
  rating: 3/5
  date: Oct 21, 2018
  review: |-
