- id: 55319176
  title: "Good Thinking: Why Flawed Logic Puts Us All at Risk and How Critical Thinking Can Save the World"
  author: Grimes, David Robert
  rating: 5/5
  date: Jun 19, 2021
  review: |-
    What a great book! I've read a couple of critical thinking books in the last
    couple of years and this was by far the best. The use of stories and real
    examples makes understanding the fallacies and hazards to critical thinking
    much easier to understand and watch for.

    I suspect everybody reading this book will come across or at least recognize
    an example of where the thinking may have led them astray. Reading this book
    will help inoculate yourself from the reams of bad informations pushed by
    accident and on purpose.

    I think everybody would benefit and enjoy this is book. Even better, read it
    with a friend or in a group to stimulate discussion.
