  review: |-
    Found from a recommendation from a post by a women on Reddit that said the
    book changed her life.

    I'd recommend anybody interested in sexuality (and really, who isn't?) read
    this. For women I think you will find a lot of comfort that you are normal
    and beautify just as you are. For men, read this as an act of empathy
    towards all women to understand just how messed up our culture towards all
    sexuality in generally but specifically how women definitely get the short
    end of the stick.

    I found the first part of the book at bit repetitive but by Chapter 5 and
    onwards I found I kept on highlighting sections. This is a good book to read
    a short section to a couple of people and open up for discussion.
- id: 30553
  title: The Road to Wigan Pier
  author: Orwell, George
  rating: 4/5
  date: Sep 07, 2020
  review: |-
    Intriguing book on 20th century depression era industrial England. Orwell is
    a very good writer and gives a vivid picture of the working conditions of
    that time. Second half of the book is about making a solid case for
    socialism. I really loved Animal Farm and 1984 so this is my first
    non-fiction by the author. Only 4 stars because some of the content is a bit
    long...

    “Talking once with a miner I asked him when the housing shortage first
    became acute in his district; he answered, ‘When we were told about it',
    meaning that till recently people's standards were so low that they took
    almost any degree of overcrowding for granted.”

    If I learned nothing else, I learned I wouldn't last 1 day as coal miner at
    that time. The limits of what humans can withstand and accept as "normal" is
    incredible.
- id: 394535
  title: Blood Meridian, or, the Evening Redness in the West
  author: McCarthy, Cormac
  rating: 5/5
  date: Aug 12, 2020
  review: |-
    Wanted to read something to contrast The Inconvenient Indian I recently
    finished. Yikes, what a novel! Difficult and not an easy read but this one
    is going to stick with me for a while. Felt like a mash up between Quentin
    Tarantino and Henry David Thoreau. This is capital L Literature. Many times
    I read a page and was left not understanding what I was going on while at
    the same time feeling this is significant.

    This isn't for everybody but I'm glad to have read it and will try some more
    of his novels because of it.
- id: 15797509
  title: "The Inconvenient Indian: A Curious Account of Native People in North America"
  author: King, Thomas
  rating: 5/5
  date: Jul 09, 2020
  review: |-
    Extremely readable account of North American native people. What I
    appreciated most was the author's ability to tell so much with such a short
    book. I found him going into the right level of detail on many topics I've
    heard mention of but not fully understood.

    Steve Bell's review perfectly summed up how I felt about the book.
    https://www.goodreads.com/review/show...
- id: 464260
  title: The Fire Next Time
  author: Baldwin, James
  rating: 4/5
  date: Jun 17, 2020
  review: |-

- id: 27436585
  title: Anything You Want
  author: Sivers, Derek
  rating: 5/5
  date: May 24, 2020
  review: |-
    It is so enjoyable and refreshing when a book/story is the length it should
    be. I just loved the stories, lessons, and philosophy. So nice when somebody
    can explain the thoughts in your head better than you can so you can then
    share them and discuss them with others.

    I've heard Derek talk before and even remember the passion he had around
    learning Ruby on Rails back in the day. It's great to hear his story and the
    world is a better place for him being in it.

    Do yourself a favour and listen to the audiobook version even if you read
    the book.
- id: 242472
  title: "The Black Swan: The Impact of the Highly Improbable"
  author: Taleb, Nassim Nicholas
  rating: 4/5
  date: May 14, 2020
  review: |-
    I really want to give this book 3 stars and maybe fewer based on all the
    times I was yelling at the author. And yet I kept reading because he has
    some interesting points. The problem is all all the side journeys you need
    to follow to get to the nuggets at the end I feel I missed half of the
    concepts.

    It doesn't help that the author is difficult to like.

    The book is about exactly what the subtitle says but you need to read the
    book to understand the importance of the topic with his examples. The gist
    being that humans aren't capable of thinking in terms of extreme events and
    so we ignore them and they cause great harm (or good). As the world is
    changing to produce more of these improbable events a new non-intuitive way
    of thinking is needed to help hedge against the impacts. I'm sure this is a
    horrible summary and the author would murder me with words or just as likely
    write me off as incompetent. I'm good with either either outcome.
- id: 1743186
  title: Unwritten Laws of Engineering
  author: King, W.J.
  rating: 5/5
  date: May 17, 2020
  review: |-
    I appreciate books that aren't longer than they need to be. So many 400 page
    books would be better at 60 written in clear prose. I suppose there is room
    for all types but this book fits my preference. Timeless knowledge written
    clearly. This book is more about being reminded of the importance of stuff
    you already know. The value comes from the concise clear writing. You can
    read this in a couple of well used hours.
- id: 26228034
  title: "The Obelisk Gate (The Broken Earth, #2)"
  author: Jemisin, N.K.
  rating: 4/5
  date: Apr 04, 2020
  review: |-
    Quite different than book 2 while keeping the same characters. The world and
    events continue to be intriguing but the flow and story wasn't as
    interesting which was disappointing a bit. I'm going to give book 3 a try
    and hope it picks up.
- id: 35629070
  title: "The Meditations (Stoic Philosophy #2)"
  author: Marcus Aurelius
  rating: 4/5
  date: Mar 21, 2020
  review: |-
    A interpretation of Marcus Aurelius's Meditations in modern English. It's
    similar to The Manual which I read earlier this year also by Sam Torode.
    I've tried unsuccessfully to read the original historical Meditations book
    unsuccessfully. Was impossible to get the nuggets of wisdom from the
    monologues and repetition. I'm happy for Sam's translations as I don't think
    I could get through these books without them being more approachable.

    The small book is packed with words and phrases of wisdom. I read it in sips
    since as there is a lot to digest in even a few pages.
- id: 5168
  title: Where the Heart Is
  author: Letts, Billie
  rating: 4/5
  date: Apr 25, 2020
  review: |-
    Liked it more than I thought I would. This is the definition of chick lit
    but I needed something easy to read and completely different to distract
    from the COVID-19 pandemic. The first chapter almost lost me but I realized
    that it was meant to position the characters to be over the top so that the
    rest of the book you could journey with them as they grow. This book isn't
    going to change your world but you'll have a new fictional friend at the
    end.
- id: 18197267
  title: "Don't Make Me Think, Revisited: A Common Sense Approach to Web Usability"
  author: Krug, Steve
  rating: 4/5
  date: Feb 27, 2020
  review: |-
    I read the first edition of this book way back in early 2000s and was
    impressed. It laid out a lot of the early work by Jason Neilson on UX in an
    easier to approach package. Well the book has aged reasonably well. What was
    true then is still true and the messaging is still quick and on point.

    I didn't get a whole lot of new information from the book but the chapter on
    accessibility did have a very interesting point about why it's the right
    thing to do. It's rare in life to have an opportunity to make a substantial
    improvement in people's life but accessibility is one of those areas.
    Improving UX is great and should be done but the difference with
    accessibility is that you can change your device from not usable at all to
    usable. Think of the fact that newspapers are now easily read by blind
    people. That is a substantial improvement that was made by adding
    accessibility.
- id: 19161852
  title: "The Fifth Season (The Broken Earth, #1)"
  author: Jemisin, N.K.
  rating: 4/5
  date: Feb 14, 2020
  review: |-
    Original fantasy, love the world, the characters, all the different areas to
    explore. The book sort of just ends so I'll read the next two in the
    trilogy. I knocked a star off because the first quarter of the book is quite
    confusing and difficult. I'm not sure if that was needed and it almost
    stopped me from reading the rest of the book but I'm glad I finished as it
    gets a lot easier and everything does flow together.

    Maybe I haven't read a lot of fantasy but I appreciated the take on
    relationships with the characters. I also liked the layers of "deadcivs" in
    the background and how the nobody (including the reader :) has a complete
    picture so you take part in the unfolding.

    If you are looking for an original fantasy I'd recommend starting this
    series. If that changes after reading the other two in the series I'll
    update this review.
- id: 67825
  title: "Peopleware: Productive Projects and Teams"
  author: DeMarco, Tom
  rating: 4/5
  date: Feb 04, 2020
  review: |-
    I read the first edition of this book when I was studying computer science.
    It has a bit of cruft but has aged quite well and enjoyed it all the more
    knowing the lessons still hold true. I found that after 10 years in software
    the technical issues stopped being the problem and for the last 15 years all
    the really difficult problems in building software are sociological. I
    suppose that is true in most industries.

    Easy to read with constructive suggestions that when first published are
    thankfully not so radical and are being adopted in more locations. The
    industry has a long way to go but we've made progress.
- id: 27323
  title: Hiroshima
  author: Hersey, John
  rating: 4/5
  date: Jan 30, 2020
  review: |-
    After finishing Unbroken by Hillenbrand I wanted to read something from the
    Japanese perspective. The two books pair well, with Hiroshima telling the
    the story of the bombing through the lens of 6 people. After reading both
    sides of the story I was left with confused at the colossal failure of
    leadership the world over that caused so much suffering for so many people.
- id: 8664353
  title: "Unbroken: A World War II Story of Survival, Resilience and Redemption"
  author: Hillenbrand, Laura
  rating: 5/5
  date: Jan 20, 2020
  review: |-
    Very well written amazing story. I couldn't believe it's a biography as the
    story seems almost too far fetched and yet there it is.
- id: 25159062
  title: "Narconomics: How to Run a Drug Cartel"
  author: Wainwright, Tom
  rating: 5/5
  date: Jan 07, 2020
  review: |-
    Clear writing, thought provoking. Reading this book will change your mind
    about how the "War on Drugs" for the last 30 years has done little to
    relieve suffering and much harm at handling hundreds of billions of dollars
    to international criminal syndicates.

    Lots of interesting ideas in each chapter but the gist is trying to solve
    the problem by limiting supply rather than addressing the problem in the
    counties using the drugs will never solve the problem and will continue to
    waste money and wreck lives.
- id: 590563
  title: Ragged Company
  author: Wagamese, Richard
  rating: 5/5
  date: Dec 29, 2019
  review: |-
    Recommended by a friend's sister over Christmas and a perfect book to close
    out 2019 with. I have been looking for a good Canadian native author and
    story and had hoped Moon of the Crusted Snow would be it that I read earlier
    this year but this one blew my mind.

    As I was reading the book I thought the even that dramatically changes the
    characters circumstances was far fetched but found out that a similar event
    happened about 8 years after the book was published to a person in Vancouver
    (search online and you'll find two CBC articles).

    If you want a powerful read about homelessness and live in Canada you can't
    go wrong with this novel. Looking forward to reading more from the author.
- id: 46223297
  title: Permanent Record
  author: Snowden, Edward
  rating: 5/5
  date: Dec 19, 2019
  review: |-
    Edward Snowden is a personal hero of mine so obviously this review is
    biased. That said the book was well written, informative, and that parts
    about the IC (Intelligence Community) riveting.

    It is telling about a society that doesn't pardon Snowden. He changed the
    world for the better at a tremendous price to himself. Also, massive kudos
    to Lindsey and his family for sticking with him. I can't imagine the
    personal pain they must have went through during the time of the leaks.
- id: 41940388
  title: The Test
  author: Neuvel, Sylvain
  rating: 5/5
  date: Nov 30, 2019
  review: |-
    Black Mirror episode as a short story. It's messed up and definitely worth
    the quick read.
- id: 28815
  title: "Influence: The Psychology of Persuasion"
  author: Cialdini, Robert B.
  rating: 4/5
  date: Sep 02, 2019
  review: |-
    Good book. 20 years ago I would see it as ground breaking. Reading it now I
    see how it's popularity has influenced many businesses. Worth reading to
    understand how advertising is used against you.
- id: 16256798
  title: "The One Thing: The Surprisingly Simple Truth Behind Extraordinary Results"
  author: Keller, Gary
  rating: 3/5
  date: Nov 29, 2019
  review: |-
    A book that should have been half or even less the length. The first third
    is horrible but the middle section is where the actual value comes in and
    was enough to motivate me to to finish reading it though I'm sure I skipped
    every third word and didn't lose any value. It follows a classic business
    book format of mostly personal stories and anecdotes with small gem of a
    focusing question. The value comes from that the question has been helpful
    in focusing and getting better results. Wondering how this will compare to
    Deep Work.
- id: 10799
  title: A Farewell to Arms
  author: Hemingway, Ernest
  rating: 5/5
  date: Nov 29, 2019
  review: |-
    Wow, what a read. First impressions is why is his writing considered good?
    At first glance it's almost comically simply but power of the story and the
    effect of the writing keeps building. That last chapter...
- id: 39082248
  title: "Moon of the Crusted Snow (Moon, #1)"
  author: Rice, Waubgeshig
  rating: 3/5
  date: Nov 10, 2019
  review: |-
    I loved the premise and idea behind this First Nations post apocalyptic
    story based in Ontario but unfortunately just wasn't drawn in as much as I
    had hoped. I think the writing style just didn't agree with me.
- id: 34066798
  title: A Gentleman in Moscow
  author: Towles, Amor
  rating: 4/5
  date: Oct 31, 2019
  review: |-
    I feel Count Rostov will be a life long friend. I wonder if somebody like
    that can actually exist? Regardless it was enjoyable spending the 6 weeks
    with him while I read this. Maybe a tad long but the character development
    is so good and story is interesting. My Russian history is prevents me from
    knowing how accurate the events are but I throughly enjoyed the book.
- id: 28257707
  title: "The Subtle Art of Not Giving a F*ck: A Counterintuitive Approach to Living a Good Life"
  author: Manson, Mark
  rating: 3/5
  date: Jun 30, 2019
  review: |-

- id: 56674
  title: Empire of the Sun
  author: Ballard, J.G.
  rating: 4/5
  date: Oct 16, 2019
  review: |-
    Horrifying matter of fact sorry told from a child experiencing WW2 in China.
    What makes it so disturbing is how the child simply accepts his fate and
    even naively interprets the events happening to hide. Writing is solid.
    Maybe a bit verbose in some places but mostly quick and fast paced. Enjoyed
    the book.
- id: 37638098
  title: "Creative Selection: Inside Apple's Design Process During the Golden Age of Steve Jobs"
  author: Kocienda, Ken
  rating: 4/5
  date: Sep 10, 2019
  review: |-
    Interesting stories and insight into life of an Apple software engineer. If
    you are into software and Apple you will enjoy this. Lots of insight into
    how the first iPhone was developed and the problems they had to solve.
- id: 17819467
  title: "The Juliette Society (The Juliette Society, #1)"
  author: Grey, Sasha
  rating: 3/5
  date: Sep 05, 2019
  review: |-
    First full length erotic novel I've read and was better than I expected
    (which was low based on how bad it was reviewed on GoodReads).
- id: 38820046
  title: 21 Lessons for the 21st Century
  author: Harari, Yuval Noah
  rating: 5/5
  date: Aug 27, 2019
  review: |-
    Harari continues with a third thought provoking book. I'm glad to have read
    them in order as I find the ideas overlap between books and layer well. This
    one gives ideas and understanding of our present day ending with a
    devastating lesson 20 about the meaning of life.
- id: 33413887
  title: "Birding Without Borders: An Obsession, A Quest, and the Biggest Year in the World"
  author: Strycker, Noah
  rating: 5/5
  date: Aug 21, 2019
  review: |-
    Fun, well written, inspiring adventure by a caring and passionate birder.
    Reminded me of a next generation Kingbird Highway. If you read the book
    watch the 5 min YouTube video on the author's website which summarizes the
    adventure nicely.

    Recommend for adventurous birders.
- id: 35220
  title: The Red Badge of Courage
  author: Crane, Stephen
  rating: 3/5
  date: Aug 19, 2019
  review: |-
    Honestly, I feel 3 stars is generous for this book. Read it based on the
    classic status and thought it would get better. It's not that it is
    horrible, it just isn't very good. The length of book makes it easy to
    complete. If you are interested in a civil war novel try "The Killer Angels"
    and skip this.
- id: 25241484
  title: Ru
  author: Thúy, Kim
  rating: 4/5
  date: Aug 05, 2019
  review: |-

- id: 25451264
